name: Deploy to DreamHost

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DH_SSH_KEY: ${{ secrets.DH_SSH_KEY }}
          DH_HOST: ${{ secrets.DH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DH_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -H "$DH_HOST" >> ~/.ssh/known_hosts && [ -s ~/.ssh/known_hosts ] && break
            echo "ssh-keyscan falló (intento $i), reintentando..."
            sleep 5
          done
          [ -s ~/.ssh/known_hosts ] || { echo "No se pudo obtener la host key de $DH_HOST"; exit 1; }

      - name: Check key shape
        run: |
          echo "lines: $(wc -l < ~/.ssh/deploy_key)"
          echo "first: $(head -1 ~/.ssh/deploy_key | cut -c1-40)"
          echo "last: $(tail -1 ~/.ssh/deploy_key | cut -c1-40)"
          echo "longest line: $(awk '{ if (length($0)>m) m=length($0) } END {print m}' ~/.ssh/deploy_key)"
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null && echo "key OK" || echo "key INVALID"

      - name: Sync files
        env:
          DH_HOST: ${{ secrets.DH_HOST }}
          DH_USER: ${{ secrets.DH_USER }}
          DH_PATH: ${{ secrets.DH_PATH }}
        run: |
          rsync -avz \
            --exclude='.git*' --exclude='.vscode' --exclude='*.code-workspace' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ "$DH_USER@$DH_HOST:$DH_PATH/"
